name: Ship Delivery
run-name: Ship ${{ inputs.ship_execution_id }}

on:
  workflow_dispatch:
    inputs:
      ship_execution_id:
        description: Ship execution identifier
        required: true
        type: string
      aws_role_arn:
        description: AWS role assumed through GitHub OIDC
        required: true
        type: string
      aws_region:
        description: AWS region
        required: true
        type: string
      ecr_repository:
        description: Full ECR repository URI
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          if [ -f requirements.lock ]; then pip install -r requirements.lock; elif [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install .; fi
          python -m pip install pytest
      - name: Run tests
        run: python -m pytest -q

  scan:
    name: Security scan
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Scan source and configuration
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  build:
    name: Build and publish
    needs: [test, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ inputs.ecr_repository }}:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Write release evidence
        shell: bash
        run: |
          cat > ship-release.json <<'SHIP_RELEASE_EOF'
          {
            "execution_id": "${{ inputs.ship_execution_id }}",
            "commit": "${{ github.sha }}",
            "image": "${{ inputs.ecr_repository }}",
            "digest": "${{ steps.build.outputs.digest }}"
          }
          SHIP_RELEASE_EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ship-release-${{ inputs.ship_execution_id }}
          path: ship-release.json
          if-no-files-found: error
