[project]
name = "linux-sre-env"
version = "2.0.0"
description = "Linux System Reliability Engineer Training Environment"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "numpy==2.5.1",
    "openai==2.45.0",
    "openenv-core==0.3.0",
]

[project.scripts]
server = "server.app:main"

[tool.openenv]
serve = "src.server:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta:__legacy__"
